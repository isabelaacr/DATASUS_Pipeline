[project]
name = "dcj"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy", "pyarrow", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
download = ["pysus>=2.0"]
notebook = ["ipykernel"]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
